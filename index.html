<div id="app"></div>
<script>

class DCLogic{constructor(){this.props={defaultGroup:"1"};this.state={};}
 setState(o){Object.assign(this.state,o);this._r&&this._r();}}

class Component extends DCLogic {
  renderVals() {
    const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const fmt = (iso) => { const p = iso.split('-').map(Number); return p[2] + ' ' + MON[p[1] - 1]; };

    const EQ = {
      L1: { name: "Bernoulli's Theorem Demonstration", kind: 'CE', dom: 'F' },
      L2: { name: 'Free and Forced Vortex', kind: 'OE', dom: 'F' },
      L3: { name: 'Flow Over Weirs', kind: 'OE', dom: 'F' },
      L4: { name: 'Flowmeter Demonstrations', kind: 'CE', dom: 'F' },
      L5: { name: 'Osborne Reynolds Apparatus', kind: 'OE', dom: 'F' },
      L6: { name: 'Fluid Mixing', kind: 'OE', dom: 'F' },
      L7: { name: 'Fluid Friction Apparatus', kind: 'CE', dom: 'F', un: true },
      L8: { name: 'Multi-Pump', kind: 'CE', dom: 'F', un: true },
      L9: { name: 'Film Boiling Condensation', kind: 'CE', dom: 'T' },
      L10: { name: 'Properties Measurement/PVT', kind: 'CE', dom: 'T' },
      L11: { name: 'Refrigeration Unit', kind: 'CE', dom: 'T' },
      L12: { name: 'Vapor Liquid Equilibrium (VLE) Unit', kind: 'CE', dom: 'T', un: true },
      L13: { name: 'Marcet Boiler', kind: 'OE', dom: 'T' }
    };
    const RPT = { GR: 'GR · Group report', IR: 'IR · Individual report', GM: 'GM · Group manuscript' };
    const RPT_SHORT = { GR: 'GR · Group', IR: 'IR · Individual', GM: 'GM · Manuscript' };
    const SCHED = {
      1: { 3: ['L1', 'IR'], 4: ['L3', 'GM'], 6: ['L5', 'GM'], 9: ['L10', 'IR'], 10: ['L6', 'GM'] },
      2: { 3: ['L10', 'GR'], 4: ['L4', 'IR'], 6: ['L6', 'GM'], 9: ['L5', 'GM'], 10: ['L13', 'GM'] },
      3: { 3: ['L9', 'GR'], 4: ['L5', 'GM'], 6: ['L13', 'GM'], 9: ['L1', 'IR'], 10: ['L2', 'GM'] },
      4: { 3: ['L5', 'GM'], 4: ['L2', 'GM'], 6: ['L3', 'GM'], 9: ['L11', 'GR'], 10: ['L1', 'IR'] },
      5: { 3: ['L11', 'GR'], 4: ['L13', 'GM'], 6: ['L2', 'GM'], 9: ['L4', 'IR'], 10: ['L3', 'GM'] }
    };
    const WEEKS = [
      { n: 1, d: '2026-09-28', k: 'briefing' },
      { n: 2, d: '2026-10-05', k: 'consult' },
      { n: 3, d: '2026-10-12', k: 'lab' },
      { n: 4, d: '2026-10-19', k: 'lab' },
      { n: 5, d: '2026-10-26', k: 'consult', due: 3 },
      { n: 6, d: '2026-11-02', k: 'lab', due: 4 },
      { n: 7, d: '2026-11-09', k: 'mta', note: 'Final consultation' },
      { n: 8, d: '2026-11-16', k: 'mta', due: 6 },
      { n: 9, d: '2026-11-23', k: 'lab' },
      { n: 10, d: '2026-11-30', k: 'lab' },
      { n: 11, d: '2026-12-07', k: 'none', due: 9 },
      { n: 12, d: '2026-12-14', k: 'none', due: 10 },
      { n: 0, d: '2026-12-21', k: 'break' },
      { n: 13, d: '2026-12-28', k: 'revision' },
      { n: 14, d: '2027-01-04', k: 'test' }
    ];
    const PLAIN = {
      briefing: 'Online briefing',
      consult: 'Consultation with technical staff',
      mta: 'Mid-term assessment break (MTA)',
      none: 'No lab session',
      break: 'Break week',
      revision: 'Revision',
      test: 'Test (online)'
    };
    const MAIN = {
      briefing: 'Briefing',
      consult: 'Consultation',
      mta: 'MTA',
      none: 'Submission',
      break: 'Break',
      revision: 'Revision',
      test: 'Test'
    };
    const LABW = [3, 4, 6, 9, 10];
    const DUEW = { 3: 5, 4: 6, 6: 8, 9: 11, 10: 12 };
    const dateOf = (n) => fmt(WEEKS.find((w) => w.n === n).d);

    const base = 'display:inline-block;padding:3px 12px;border-radius:999px;font-size:14px;font-weight:600;line-height:1.5;';
    const DOM = {
      F: { t: 'Fluids', s: base + 'background:#D6EAEC;color:#0B4F55;', bar: '#12767E', bg: '#D6EAEC' },
      T: { t: 'Thermodynamics', s: base + 'background:#F4E3DC;color:#6B2F1E;', bar: '#9A4A33', bg: '#F4E3DC' }
    };
    const KIND = {
      CE: { t: 'Closed-ended (CE)', s: base + 'background:#ffffff;color:#12171B;border:1px solid #12171B;' },
      OE: { t: 'Open-ended (OE)', s: base + 'background:#12171B;color:#ffffff;border:1px solid #12171B;' }
    };
    const rptStyle = base + 'background:#E6ECF0;color:#243B4A;';

    let saved = 0;
    try { saved = Number(window.localStorage.getItem('che486Group')) || 0; } catch (e) { saved = 0; }
    const g = Number((this.state && this.state.group) || saved || this.props.defaultGroup || 1);

    // minggu semasa
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const starts = WEEKS.map((w) => { const p = w.d.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); });
    let cur = -1;
    for (let i = 0; i < starts.length; i++) { if (today >= starts[i]) cur = i; }
    const endLast = new Date(starts[starts.length - 1].getTime() + 7 * 86400000);
    if (today >= endLast) cur = -2;

    // kad "Minggu ini" dalam banner
    const rows = WEEKS.map((w) => {
      const lab = w.k === 'lab' ? SCHED[g][w.n] : null;
      let due = '';
      if (w.due) {
        const l = SCHED[g][w.due];
        due = 'Submit report ' + l[0] + ' (' + RPT[l[1]] + ')';
      }
      const row = {
        week: w.n ? 'Week ' + w.n : 'Break',
        date: fmt(w.d),
        hasLab: !!lab,
        hasPlain: !lab,
        plain: lab ? '' : PLAIN[w.k],
        hasDue: !!w.due,
        due: due,
        labCode: '', labName: '', domLabel: '', domStyle: '', kindLabel: '', kindStyle: '', rptLabel: '', rptStyle: rptStyle
      };
      if (lab) {
        const e = EQ[lab[0]];
        row.labCode = lab[0];
        row.labName = e.name;
        row.domLabel = DOM[e.dom].t;
        row.domStyle = DOM[e.dom].s;
        row.kindLabel = KIND[e.kind].t;
        row.kindStyle = KIND[e.kind].s;
        row.rptLabel = RPT[lab[1]];
      }
      return row;
    });

    // peta semester
    const tiles = WEEKS.map((w, i) => {
      const isNow = i === cur;
      let main = MAIN[w.k];
      let sub = '';
      let bg = '#ffffff';
      let bd = '1px solid #C5D1D9';
      if (w.k === 'lab') {
        const l = SCHED[g][w.n];
        const e = EQ[l[0]];
        main = l[0];
        bg = DOM[e.dom].bg;
        bd = '2px solid ' + DOM[e.dom].bar;
      } else if (w.k === 'briefing' || w.k === 'consult') {
        bg = '#E6ECF0';
      } else if (w.k === 'mta' || w.k === 'break') {
        bd = '1px dashed #8A99A4';
      } else if (w.k === 'test') {
        bg = '#9FD6DB';
        bd = '1px solid #9FD6DB';
      }
      if (w.due) { sub = 'Submit ' + SCHED[g][w.due][0]; }
      if (w.note) { sub = w.note; }
      return {
        week: w.n ? 'M' + w.n : 'Break',
        date: fmt(w.d),
        main: main,
        sub: sub,
        hasSub: !!sub,
        isNow: isNow,
        style: 'box-sizing:border-box;min-height:116px;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;color:#12171B;background:' + bg + ';border:' + bd + ';' +
          (isNow ? 'box-shadow:0 0 0 3px #5BC4CC,0 0 0 5px #12171B;' : '')
      };
    });

    // perjalanan (jalan berliku mendatar, 3 baris x 5)
    const journey = WEEKS.map((w, i) => {
      let pinBg = '#4A5F6D', cardBg = '#E6ECF0', cardBd = '1px solid #C5D1D9', name = '', sub = '';
      let main = MAIN[w.k];
      if (w.k === 'lab') {
        const l = SCHED[g][w.n];
        const e = EQ[l[0]];
        main = l[0];
        name = e.name;
        pinBg = DOM[e.dom].bar;
        cardBg = '#ffffff';
        cardBd = '2px solid ' + DOM[e.dom].bar;
      } else if (w.k === 'mta' || w.k === 'break') {
        const isBreak = w.k === 'break';
        pinBg = isBreak ? '#9A6F00' : '#8A99A4';
        cardBg = isBreak ? '#F6E3A1' : '#ffffff';
        cardBd = isBreak ? '2px solid #C9A227' : '1px dashed #8A99A4';
      } else if (w.k === 'test') {
        pinBg = '#0E5F66';
        cardBg = '#9FD6DB';
        cardBd = '1px solid #9FD6DB';
      }
      if (w.due) { sub = 'Submit ' + SCHED[g][w.due][0]; }
      if (w.note) { sub = w.note; }
      const row = Math.floor(i / 5);
      const k = i % 5;
      const col = row % 2 === 0 ? k + 1 : 5 - k;
      const isNow = i === cur;
      return {
        week: w.n ? 'Week ' + w.n : 'Break',
        date: fmt(w.d),
        pin: w.n ? String(w.n) : 'R',
        main: main,
        name: name,
        hasName: !!name,
        sub: sub,
        hasSub: !!sub,
        isNow: isNow,
        ringR: row === 0 && k === 4,
        ringL: row === 1 && k === 4,
        cellStyle: 'grid-column:' + col + ';grid-row:' + (row + 1) + ';',
        cardStyle: 'background:' + cardBg + ';border:' + cardBd + ';box-shadow:' + (isNow ? '0 0 0 3px #5BC4CC,0 0 0 6px #12171B' : '0 6px 18px rgba(18,23,27,0.08)') + ';',
        pinStyle: 'position:absolute;left:50%;top:42px;width:46px;height:46px;box-sizing:border-box;transform:translate(-50%,-62%) rotate(-45deg);border-radius:50% 50% 50% 0;background:' + pinBg + ';border:3px solid #ffffff;color:#ffffff;display:flex;align-items:center;justify-content:center;z-index:2;' +
          (isNow ? 'box-shadow:0 0 0 4px #5BC4CC,0 0 0 7px #12171B;' : 'box-shadow:0 4px 10px rgba(0,0,0,0.3);')
      };
    });

    // lima kad eksperimen
    const chipD = 'display:inline-block;padding:3px 14px;border-radius:999px;font-size:15px;font-weight:600;line-height:1.5;';
    const labCards = LABW.map((n, idx) => {
      const l = SCHED[g][n];
      const e = EQ[l[0]];
      const wi = WEEKS.findIndex((w) => w.n === n);
      const dd = WEEKS[wi].d.split('-').map(Number);
      const rev = idx % 2 === 1;
      return {
        step: idx + 1,
        week: 'Week ' + n,
        day: String(dd[2]).padStart(2, '0'),
        mon: MON[dd[1] - 1] + ', ' + dd[0],
        code: l[0],
        name: e.name,
        domLabel: DOM[e.dom].t,
        domStyle: chipD + 'background:' + DOM[e.dom].bg + ';color:' + (e.dom === 'F' ? '#0B4F55' : '#6B2F1E') + ';',
        kindLabel: KIND[e.kind].t,
        kindStyle: chipD + (e.kind === 'CE' ? 'background:transparent;color:#ffffff;border:1px solid #ffffff;' : 'background:#ffffff;color:#12171B;border:1px solid #ffffff;'),
        rptLabel: RPT_SHORT[l[1]],
        rptStyle: chipD + 'background:rgba(255,255,255,0.16);color:#ffffff;',
        submit: 'Submit report: ' + dateOf(DUEW[n]),
        rowStyle: 'box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;gap:20px 36px;padding:28px 40px;border-radius:6px;color:#ffffff;' +
          'flex-direction:' + (rev ? 'row-reverse' : 'row') + ';' +
          'background:radial-gradient(520px 220px at ' + (rev ? '100%' : '0%') + ' 50%,rgba(18,118,126,0.55),transparent 70%),linear-gradient(' + (rev ? '260deg' : '100deg') + ',#151D24,#22313C 70%,#2B3E4B);' +
          'border-' + (rev ? 'right' : 'left') + ':10px solid ' + DOM[e.dom].bar + ';' +
          (wi === cur ? 'box-shadow:0 0 0 3px #5BC4CC,0 0 0 6px #12171B;' : 'box-shadow:0 10px 28px rgba(18,23,27,0.18);'),
        textStyle: 'flex:1 1 300px;min-width:0;text-align:' + (rev ? 'right' : 'left') + ';',
        chipsStyle: 'display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:' + (rev ? 'flex-end' : 'flex-start') + ';'
      };
    });

    const groups = [1, 2, 3, 4, 5].map((n) => ({
      label: 'Group ' + n,
      pressed: n === g,
      style: 'min-height:52px;padding:0 26px;border-radius:999px;font:inherit;font-size:17px;font-weight:600;cursor:pointer;border:2px solid #12171B;' +
        (n === g ? 'background:#1E2A33;color:#ffffff;box-shadow:0 0 0 3px #5BC4CC;' : 'background:#ffffff;color:#12171B;'),
      pick: () => { try { window.localStorage.setItem('che486Group', String(n)); } catch (e) {} this.setState({ group: n }); }
    }));

    const mk = (code) => {
      const e = EQ[code];
      return {
        code: code,
        name: e.name,
        tag: e.un ? 'Unavailable' : KIND[e.kind].t,
        tagStyle: e.un ? base + 'background:#E6ECF0;color:#4A5F6D;' : KIND[e.kind].s,
        nameStyle: e.un ? 'color:#4A5F6D;' : ''
      };
    };

    return {
      groupN: g,
      groups: groups,
      groupName: 'Group ' + g,
      tiles: tiles,
      journey: journey,
      labCards: labCards,
      hasCur: cur >= 0,
      noCur: cur < 0,
      noCurMsg: cur === -1 ? 'Semester starts on 28 Sep 2026.' : 'This semester has ended.',
      cur: cur >= 0 ? rows[cur] : rows[0],
      fluid: ['L1', 'L2', 'L3', 'L4', 'L5', 'L6', 'L7', 'L8'].map(mk),
      thermo: ['L9', 'L10', 'L11', 'L12', 'L13'].map(mk)
    };
  }
}

=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17L17 7M9 7h8v8\"><\/path><\/svg><\/span><\/a>\n<a class=\"ql\" href=\"https://drive.google.com/drive/folders/11EsaugwIYThx9ZjpwPdb6nU11WdEF6gz?usp=sharing\" target=\"_blank\" rel=\"noopener\"><span class=\"ql-ico\"><svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 3h8l4 4v14H6z\"><\/path><path d=\"M14 3v4h4M9 12h6M9 16h6\"><\/path><\/svg><\/span><span class=\"ql-body\"><span class=\"ql-t\">Manual &amp; report template<\/span><\/span><span class=\"ql-go\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17L17 7M9 7h8v8\"><\/path><\/svg><\/span><\/a>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- ============ JADUAL ============ -->\n<section id=\"jadual\" style=\"padding:64px 24px\">\n<div style=\"max-width:1200px;margin:0 auto\">\n<h2 style=\"margin:0;font-family:'Josefin Sans','IBM Plex Sans',sans-serif;font-size:clamp(30px,4vw,42px);line-height:1.15\">My schedule<\/h2>\n<h3 style=\"margin:32px 0 8px;font-size:34px\">Select your group<\/h3>\n<p style=\"margin:0 0 24px;font-size:18px;color:#243B4A\">Not sure? Check on <a href=\"https://drive.google.com/file/d/1md0rahA7aoAmNyMmQEholS13z3ev5qnf/view?usp=sharing\" target=\"_blank\" rel=\"noopener\" style=\"color:#0E5F66;font-weight:600\">UFUTURE<\/a><\/p>\n\n<div role=\"group\" aria-label=\"Choose group\" style=\"display:flex;flex-wrap:wrap;gap:12px;margin-bottom:48px\">\n<sc-for list=\"{{groups}}\" as=\"g\" hint-placeholder-count=\"5\">\n<button type=\"button\" aria-pressed=\"{{g.pressed}}\" onClick=\"{{g.pick}}\" style=\"{{g.style}}\">{{g.label}}<\/button>\n<\/sc-for>\n<\/div>\n\n<h3 style=\"margin:0 0 20px;font-size:26px\">Your journey \u00b7 {{groupName}}<\/h3>\n<div class=\"sn\">\n<sc-for list=\"{{journey}}\" as=\"j\" hint-placeholder-count=\"15\">\n<div class=\"sn-cell\" style=\"{{j.cellStyle}}\">\n<div class=\"sn-seg\" aria-hidden=\"true\"><\/div>\n<sc-if value=\"{{j.ringR}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"sn-ring-r\" aria-hidden=\"true\"><\/div><\/sc-if>\n<sc-if value=\"{{j.ringL}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"sn-ring-l\" aria-hidden=\"true\"><\/div><\/sc-if>\n<div class=\"sn-pin\" style=\"{{j.pinStyle}}\"><span style=\"display:block;transform:rotate(45deg);font-size:17px;font-weight:700;line-height:1\">{{j.pin}}<\/span><\/div>\n<div class=\"sn-card\" style=\"{{j.cardStyle}}\">\n<div style=\"font-size:14px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#4A5F6D\">{{j.week}} \u00b7 {{j.date}}<\/div>\n<div style=\"font-family:'Josefin Sans','IBM Plex Sans',sans-serif;font-size:26px;font-weight:700;line-height:1.15\">{{j.main}}<\/div>\n<sc-if value=\"{{j.hasName}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"font-size:16px;color:#243B4A;line-height:1.3\">{{j.name}}<\/div>\n<\/sc-if>\n<sc-if value=\"{{j.hasSub}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size:15px;color:#0B4F55;font-weight:600\">{{j.sub}}<\/div>\n<\/sc-if>\n<sc-if value=\"{{j.isNow}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:2px;padding:1px 12px;border-radius:999px;background:#12171B;color:#ffffff;font-size:14px;font-weight:600\">This week<\/div>\n<\/sc-if>\n<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:20px;font-size:16px;color:#243B4A\">\n<span style=\"display:inline-flex;align-items:center;gap:10px\"><span aria-hidden=\"true\" style=\"width:20px;height:20px;border-radius:5px;background:#D6EAEC;border:2px solid #12767E\"><\/span>Fluids lab<\/span>\n<span style=\"display:inline-flex;align-items:center;gap:10px\"><span aria-hidden=\"true\" style=\"width:20px;height:20px;border-radius:5px;background:#F4E3DC;border:2px solid #9A4A33\"><\/span>Thermodynamics lab<\/span>\n<span style=\"display:inline-flex;align-items:center;gap:10px\"><span aria-hidden=\"true\" style=\"width:20px;height:20px;border-radius:5px;background:#E6ECF0;border:1px solid #C5D1D9\"><\/span>Briefing / consultation<\/span>\n<span style=\"display:inline-flex;align-items:center;gap:10px\"><span aria-hidden=\"true\" style=\"width:20px;height:20px;border-radius:5px;background:#F6E3A1;border:2px solid #C9A227;box-sizing:border-box\"><\/span>Break<\/span>\n<span style=\"display:inline-flex;align-items:center;gap:10px\"><span aria-hidden=\"true\" style=\"width:20px;height:20px;border-radius:5px;background:#9FD6DB\"><\/span>Test<\/span>\n<\/div>\n\n<h3 style=\"margin:48px 0 20px;font-size:26px\">Your five experiments<\/h3>\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<sc-for list=\"{{labCards}}\" as=\"c\" hint-placeholder-count=\"5\">\n<div class=\"lb-row\" style=\"{{c.rowStyle}}\">\n<div class=\"lb-date\" style=\"flex:0 0 150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center\">\n<div style=\"font-family:'Josefin Sans','IBM Plex Sans',sans-serif;font-size:76px;font-weight:700;line-height:1\">{{c.day}}<\/div>\n<div style=\"font-size:19px;font-weight:600;margin-top:6px\">{{c.mon}}<\/div>\n<\/div>\n<div class=\"lb-div\" aria-hidden=\"true\" style=\"width:2px;align-self:stretch;background:rgba(255,255,255,0.75);flex:0 0 2px\"><\/div>\n<div class=\"lb-text\" style=\"{{c.textStyle}}\">\n<div style=\"font-size:16px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9ED8DD\">Experiment {{c.step}}<\/div>\n<div style=\"font-family:'Josefin Sans','IBM Plex Sans',sans-serif;font-size:34px;font-weight:700;line-height:1.15;margin-top:6px\">{{c.code}} \u00b7 {{c.name}}<\/div>\n<div class=\"lb-chips\" style=\"{{c.chipsStyle}}\">\n<span style=\"{{c.domStyle}}\"> -weight:600;color:#243B4A\">Lab day<\/span>\n<div style=\"width:56px;height:56px;margin-top:16px;border-radius:50%;background:#D6E7E8;color:#0E5F66;display:flex;align-items:center;justify-content:center\"><svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\/circle><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"><\/path><\/svg><\/div>\n<h3 style=\"margin:16px 0 0;font-size:22px;line-height:1.3\">Explain the procedure to the lecturer<\/h3>\n<\/div>\n\n<div class=\"chev\"><svg aria-hidden=\"true\" width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5l7 7-7 7\"><\/path><\/svg><\/div>\n\n<div class=\"tl step\" style=\"background:#ffffff;border:1px solid #C3CED3;border-radius:12px;padding:24px;box-shadow:0 1px 3px rgba(18,23,27,0.10)\">\n<span style=\"display:inline-block;padding:2px 12px;border-radius:999px;background:#E6ECF0;font-size:14px;font-weight:600;color:#243B4A\">Lab day<\/span>\n<div style=\"width:56px;height:56px;margin-top:16px;border-radius:50%;background:#D6E7E8;color:#0E5F66;display:flex;align-items:center;justify-content:center\"><svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3\"><\/path><path d=\"M7.5 15h9\"><\/path><\/svg><\/div>\n<h3 style=\"margin:16px 0 0;font-size:22px;line-height:1.3\">Run the experiment and record data<\/h3>\n<\/div>\n\n<div class=\"chev\"><svg aria-hidden=\"true\" width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5l7 7-7 cv=document.getElementById('c'),ctx=cv.getContext('2d'),subEl=document.getElementById('sub');\nconst C={p:'#4da3ff',k:'#ff9d3d',g:'#5fd39a',r:'#ff5d5d',ink:'#e8eefc',mut:'#8da0c4'};\nfunction fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)}\naddEventListener('resize',fit);fit();if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);\nconst clamp=(x,a=0,b=1)=&gt;Math.min(b,Math.max(a,x));\nconst ss=x=&gt;{x=clamp(x);return x*x*(3-2*x)};\nconst prog=(t,a,b)=&gt;clamp((t-a)/(b-a));\nconst sceneAlpha=(t,a,b)=&gt;clamp(Math.min((t-a)/0.6,(b-t)/0.6));\n\nconst SUBS=[\n [0,&quot;Three lab equipment, three key concepts.&quot;],\n [5,&quot;Venturi meter: a narrowing pipe used to measure fluid flow rate.&quot;],\n [10,&quot;In the narrow section velocity rises and pressure drops \u2014 Bernoulli's principle.&quot;],\n [16,&quot;The pressure difference \u0394P between two points gives us the flow rate Q.&quot;],\n [22,&quot;Marcet boiler: a sealed vessel linking pressure to boiling temperature.&quot;],\n [28,&quot;Water boils when its vapour pressure equals the surrounding pressure.&quot;],\n [34,&quot;Higher pressure means a higher boiling point \u2014 the saturation curve.&quot;],\n [42,&quot;Weirs: water flows over a notch, and the flow rate is found from the head H.&quot;],\n [47.5,&quot;Same water level, different notch: different flow rates.&quot;],\n [52.5,&quot;As H rises, Q rises as H^1.5 for the rectangular and H^2.5 for the V-notch.&quot;],\n [57.5,&quot;Venturi, Marcet, Weir \u2014 understand fluids through concepts.&quot;]\n];\nconst subAt=t=&gt;{let s=&quot;&quot;;for(const [a,x] of SUBS)if(t&gt;=a)s=x;return s};\n\nfunction txt(s,x,y,size,color,a=1,align='center',weight=600){\n  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=color;ctx.font=`${weight} ${size}px system-ui,-apple-system,Segoe UI,sans-serif`;\n  ctx.textAlign=align;ctx.fillText(s,x,y);ctx.restore();\n}\nfunction chip(s,x,y,col,a,size=20){\n  ctx.save();ctx.globalAlpha=a;ctx.font=`600 ${size}px system-ui`;\n  const w=ctx.measureText(s).width+44,h=size*2.2;\n  ctx.fillStyle='rgba(255,255,255,.06)';ctx.strokeStyle=col;ctx.lineWidth=2;\n  ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,h/2);ctx.fill();ctx.stroke();\n  ctx.fillStyle=C.ink;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y+1);ctx.restore();\n}\nfunction badge(n,name,col,a){\n  ctx.save();ctx.globalAlpha=a;\n  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(20,26,124,30,15);ctx.fill();\n  ctx.fillStyle='#0b1220';ctx.font='700 15px system-ui';ctx.textAlign='center';ctx.fillText(`Equipment ${n}/3`,82,46);\n  ctx.restore();\n  txt(name,W/2,48,28,C.ink,a);\n}\n\n// ================= VENTURI =================\nconst CY=270,X0=40,X1=920;\nfunction hh(x){\n  if(x&lt;=240)return 70;\n  if(x&lt;=400)return 70-42*ss((x-240)/160);\n  if(x&lt;=540)return 28;\n  if(x&lt;=700)return 28+42*ss((x-540)/160);\n  return 70;\n}\nconst TAPS=[160,470,800],HEADS=[100,35,100];\nconst parts=[];for(let i=0;i&lt;90;i++)parts.push({x:X0+Math.random()*(X1-X0),f:(Math.random()*2-1)*0.82});\nfunction drawPipe(a){\n  ctx.save();ctx.globalAlpha=a;ctx.beginPath();\n  for(let x=X0;x&lt;=X1;x+=4)ctx.lineTo(x,CY-hh(x));\n  for(let x=X1;x&gt;=X0;x-=4)ctx.lineTo(x,CY+hh(x));\n  ctx.closePath();ctx.fillStyle='rgba(77,163,255,0.07)';ctx.fill();\n  ctx.strokeStyle='#5d7bb5';ctx.lineWidth=3;ctx.stroke();ctx.restore();\n}\nfunction drawParts(a){\n  ctx.save();ctx.globalAlpha=a;\n  for(const p of parts){\n    const r=clamp((70/hh(p.x)-1)/1.5);\n    ctx.fillStyle=`hsl(${205-170*r},90%,62%)`;\n    ctx.beginPath();ctx.arc(p.x,CY+p.f*hh(p.x),3.2,0,7);ctx.fill();\n  }ctx.restore();\n}\nfunction drawManos(a,grow){\n  ctx.save();ctx.globalAlpha=a;\n  TAPS.forEach((x,i)=&gt;{\n    const wall=CY-hh(x),top=92,w=26;\n    ctx.fillStyle='rgba(20,30,52,.9)';ctx.strokeStyle='#5d7bb5';ctx.lineWidth=2;\n    ctx.beginPath();ctx.rect(x-w/2,top,w,wall-top);ctx.fill();ctx.stroke();\n    const lev=CY-70-HEADS[i]*grow;\n    ctx.fillStyle='rgba(77,163,255,.85)';ctx.fillRect(x-w/2+2,lev,w-4,wall-lev);\n    ctx.fillStyle=C.ink;ctx.font='600 15px system-ui';ctx.textAlign='center';ctx.fillText('P'+(i+1),x,top-8);\n  });\n  ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;\n  const l0=CY-70-HEADS[0]*grow;ctx.beginPath();ctx.moveTo(TAPS[0],l0);ctx.lineTo(TAPS[2],l0);ctx.stroke();\n  ctx.restore();\n}\nfunction scVenturi(t){\n  const a=sceneAlpha(t,5,22.6);\n  badge(1,&quot;Venturi Meter \u2014 Bernoulli's Principle&quot;,C.p,a);\n  drawPipe(a);drawParts(a);\n  drawManos(a*ss(prog(t,11,12.5)),ss(prog(t,12,15.5)));\n  const la=a*ss(prog(t,9,10.5));\n  txt('low velocity',TAPS[0],CY+hh(TAPS[0])+30,16,C.p,la);\n  txt('HIGH VELOCITY',TAPS[1],CY+hh(TAPS[1])+30,16,C.k,la);\n  txt('low velocity',TAPS[2],CY+hh(TAPS[2])+30,16,C.p,la);\n  txt('P + \u00bd\u03c1v\u00b2 = constant  \u21d2  v \u2191 , P \u2193',W/2,385,22,C.k,a*ss(prog(t,13,14.5)));\n  txt('Q = Cd \u00b7 A\u2082 \u00b7 \u221a[ 2\u0394P / \u03c1(1 \u2212 \u03b2\u2074) ]',W/2,425,26,C.ink,a*ss(prog(t,17,18.5)));\n}\n\n// ================= MARCET BOILER =================\nconst bubbles=[];for(let i=0;i&lt;48;i++)bubbles.push({x:Math.random(),y:Math.random(),s:30+Math.random()*60,r:2+Math.random()*3.5});\nconst antoine=T=&gt;0.133322*Math.pow(10,8.14019-1810.94/(244.485+T)); // kPa\nfunction Tmarcet(t){return 100+80*ss(prog(t,24,37))}\nfunction scMarcet(t){\n  const a=sceneAlpha(t,22,42.6);\n  badge(2,'Marcet Boiler \u2014 Boiling',C.k,a);\n  const T=Tmarcet(t),P=antoine(T),heat=ss(prog(t,23,26));\n  const boil=clamp((T-100)/80);\n  ctx.save();ctx.globalAlpha=a;\n  // vessel\n  const vx=120,vy=110,vw=220,vh=250;\n  ctx.fillStyle='rgba(30,45,75,.55)';ctx.strokeStyle='#5d7bb5';ctx.lineWidth=3;\n  ctx.beginPath();ctx.roundRect(vx,vy,vw,vh,26);ctx.fill();ctx.stroke();\n  // water\n  const wt=vy+95;\n  ctx.save();ctx.beginPath();ctx.roundRect(vx+3,vy+3,vw-6,vh-6,24);ctx.clip();\n  ctx.fillStyle='rgba(77,163,255,.45)';ctx.fillRect(vx,wt,vw,vh);\n  // bubbles\n  ctx.fillStyle='rgba(255,255,255,.75)';\n  bubbles.forEach((b,i)=&gt;{\n    if(i/bubbles.length&gt;0.1+0.9*boil*heat)return;\n    const bx=vx+20+b.x*(vw-40),by=vy+vh-30-b.y*(vh-30-95);\n    ctx.beginPath();ctx.arc(bx,by,b.r,0,7);ctx.fill();\n  });\n  ctx.restore();\n  // heater coil\n  ctx.strokeStyle=`rgb(255,${Math.round(120-70*heat)},${Math.round(80-50*heat)})`;ctx.lineWidth=5;\n  ctx.beginPath();const cy0=vy+vh-22;ctx.moveTo(vx+30,cy0);\n  for(let i=0;i&lt;6;i++){ctx.quadraticCurveTo(vx+30+i*26+13,cy0-14,vx+30+(i+1)*26,cy0)}\n  ctx.stroke();\n  txt('vapour',vx+vw/2,vy+55,16,C.mut,a);\n  txt('water',vx+vw/2,wt+60,16,C.ink,a);\n  txt('heater',vx+vw/2,vy+vh+22,15,C.r,a);\n  // pressure gauge\n  const gx=vx+vw/2,gy=vy-22,gr=34;\n  ctx.fillStyle='#0f1a30';ctx.strokeStyle='#8da0c4';ctx.lineWidth=3;\n  ctx.beginPath();ctx.arc(gx,gy,gr,0,7);ctx.fill();ctx.stroke();\n  const ang=(-225+270*clamp(P/1000))*Math.PI/180;\n  ctx.strokeStyle=C.k;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+Math.cos(ang)*(gr-8),gy+Math.sin(ang)*(gr-8));ctx.stroke();\n  ctx.fillStyle=C.ink;ctx.font='600 11px system-ui';ctx.textAlign='center';ctx.fillText('P',gx,gy+gr-8);\n  // thermometer\n  const tx=vx+vw+30;\n  ctx.fillStyle='#0f1a30';ctx.strokeStyle='#8da0c4';ctx.lineWidth=2;\n  ctx.beginPath();ctx.roundRect(tx-8,vy,16,vh-30,8);ctx.fill();ctx.stroke();\n  const th=(vh-50)*(0.12+0.88*(T-100)/80);\n  ctx.fillStyle=C.r;ctx.fillRect(tx-4,vy+vh-30-8-th,8,th+8);\n  ctx.beginPath();ctx.arc(tx,vy+vh-12,14,0,7);ctx.fill();\n  ctx.fillStyle=C.ink;ctx.font='600 13px system-ui';ctx.fillText('T',tx,vy-6);\n  ctx.restore();\n  // P\u2013T plot\n  const px0=560,px1=900,py0=372,py1=125;\n  const X=T_=&gt;px0+(T_-100)/80*(px1-px0),Y=P_=&gt;py0-P_/1000*(py0-py1);\n  const pa=a*ss(prog(t,27,29));\n  ctx.save();ctx.globalAlpha=pa;\n  ctx.strokeStyle='#5d7bb5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px0,py1-10);ctx.lineTo(px0,py0);ctx.lineTo(px1+10,py0);ctx.stroke();\n  ctx.fillStyle=C.mut;ctx.font='600 14px system-ui';ctx.textAlign='center';\n  ctx.fillText('Temperature T (\u00b0C)',(px0+px1)/2,py0+32);\n  ctx.save();ctx.translate(px0-48,(py0+py1)/2);ctx.rotate(-Math.PI/2);ctx.fillText('Pressure P (kPa)',0,0);ctx.restore();\n  [100,140,180].forEach(v=&gt;ctx.fillText(v,X(v),py0+16));\n  ctx.textAlign='right';[0,500,1000].forEach(v=&gt;ctx.fillText(v,px0-6,Y(v)+4));\n  // curve\n  ctx.strokeStyle=C.p;ctx.lineWidth=3;ctx.beginPath();\n  for(let TT=100;TT&lt;=Tmarcet(t)+0.01;TT+=1)ctx[TT===100?'moveTo':'lineTo'](X(TT),Y(antoine(TT)));\n  ctx.stroke();\n  // dot\n  ctx.fillStyle=C.k;ctx.beginPath();ctx.arc(X(T),Y(P),7,0,7);ctx.fill();\n  ctx.textAlign='left';ctx.fillStyle=C.mut;ctx.font='600 15px system-ui';\n  ctx.fillText('LIQUID',px0+14,py1+18);ctx.fillText('VAPOUR',px1-60,py0-14);\n  ctx.restore();\n  txt(`T = ${T.toFixed(0)} \u00b0C    P = ${P.toFixed(0)} kPa`,730,108,20,C.k,a*ss(prog(t,27,29)));\n  txt('boils when P vapour = P surroundings',240,415,17,C.ink,a*ss(prog(t,30,31.5)));\n  txt('ln P = A \u2212 B / (T + C)',730,440,18,C.mut,a*ss(prog(t,38,39.5)));\n}\n\n// ================= WEIR =================\nconst drops=[];for(let i=0;i&lt;140;i++)drops.push({u:Math.random(),v:Math.random()});\nfunction drawWeir(cx,type,Hpx,a,label){\n  const pw=340,top=150,crest=235,bot=340,bpx=120,half=85;\n  ctx.save();ctx.globalAlpha=a;\n  const x0=cx-pw/2,lev=crest-Hpx;\n  ctx.fillStyle='#2a3a5e';ctx.strokeStyle='#5d7bb5';ctx.lineWidth=3;\n  ctx.beginPath();ctx.moveTo(x0,top);\n  if(type==='rect'){ctx.lineTo(cx-bpx/2,top);ctx.lineTo(cx-bpx/2,crest);ctx.lineTo(cx+bpx/2,crest);ctx.lineTo(cx+bpx/2,top);}\n  else{ctx.lineTo(cx-half,top);ctx.lineTo(cx,crest);ctx.lineTo(cx+half,top);}\n  ctx.lineTo(x0+pw,top);ctx.lineTo(x0+pw,bot);ctx.lineTo(x0,bot);ctx.closePath();ctx.fill();ctx.stroke();\n  ctx.fillStyle='rgba(77,163,255,.55)';\n  ctx.beginPath();\n  if(type==='rect'){ctx.rect(cx-bpx/2+2,lev,bpx-4,crest-lev);}\n  else{ctx.moveTo(cx,crest-1);ctx.lineTo(cx-Hpx,lev);ctx.lineTo(cx+Hpx,lev);ctx.closePath();}\n  ctx.fill();\n  ctx.setLineDash([6,5]);ctx.strokeStyle=C.p;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x0-10,lev);ctx.lineTo(x0+pw+10,lev);ctx.stroke();ctx.setLineDash([]);\n  const spread=type==='rect'?bpx/2-6:Hpx*0.7;\n  if(type==='rect'){\n    const g=ctx.createLinearGradient(0,crest,0,bot+10);g.addColorStop(0,'rgba(77,163,255,.55)');g.addColorStop(1,'rgba(77,163,255,.12)');\n    ctx.fillStyle=g;ctx.fillRect(cx-bpx/2+3,crest,bpx-6,bot+10-crest);\n  }\n  const tt=performance.now()/1000;ctx.fillStyle='rgba(200,230,255,.9)';\n  for(const d of drops){\n    const v=(d.v+tt*0.7*(0.6+Hpx/60))%1;\n    ctx.beginPath();ctx.arc(cx+(d.u*2-1)*spread*(type==='rect'?1:(0.3+0.7*v)),crest+v*v*(bot+10-crest),2.2,0,7);ctx.fill();\n  }\n  const ax=x0-4;\n  ctx.strokeStyle=C.k;ctx.fillStyle=C.k;ctx.lineWidth=2;\n  ctx.beginPath();ctx.moveTo(ax,lev);ctx.lineTo(ax,crest);ctx.stroke();\n  ctx.beginPath();ctx.moveTo(ax-5,lev+8);ctx.lineTo(ax,lev);ctx.lineTo(ax+5,lev+8);ctx.fill();\n  ctx.beginPath();ctx.moveTo(ax-5,crest-8);ctx.lineTo(ax,crest);ctx.lineTo(ax+5,crest-8);ctx.fill();\n  ctx.font='700 18px system-ui';ctx.textAlign='right';ctx.fillText('H',ax-8,(lev+crest)/2+6);\n  ctx.fillStyle=C.g;ctx.textAlign='center';ctx.fillText(label,cx,bot+25);\n  ctx.restore();\n}\nfunction scWeir(t){\n  const a=sceneAlpha(t,42,60.5);\n  badge(3,'Weirs \u2014 Flow Over a Notch',C.g,a);\n  const Hpx=30+30*ss(prog(t,52,56)),h=Hpx/30;\n  const wa=a*ss(prog(t,43,44.5));\n  drawWeir(240,'rect',Hpx,wa,'Rectangular notch (width b)');\n  drawWeir(700,'v',Hpx,wa,'V-notch (\u03b8 = 90\u00b0)');\n  const qR=107*Math.pow(h,1.5),qV=21*Math.pow(h,2.5);\n  const ba=a*ss(prog(t,48,49.5));\n  ctx.save();ctx.globalAlpha=ba;\n  [[240,qR,'Q \u221d H^1.5'],[700,qV,'Q \u221d H^2.5']].forEach(([cx,qq,l])=&gt;{\n    ctx.fillStyle=C.p;ctx.fillRect(cx-170,375,qq,14);\n    ctx.fillStyle=C.ink;ctx.font='600 15px system-ui';ctx.textAlign='left';ctx.fillText(l,cx-170+qq+10,388);\n  });\n  ctx.restore();\n  txt('Rect: Q = \u2154 Cd b \u221a(2g) H^1.5      V-notch: Q = \u2078\u2044\u2081\u2085 Cd \u221a(2g) tan(\u03b8/2) H^2.5',W/2,432,19,C.k,a*ss(prog(t,50,51.5)));\n}\n\n// ================= TITLE =================\nfunction scTitle(t){\n  const a=sceneAlpha(t,-1,5.6);\n  txt('Laboratory',W/2,110,22,C.mut,a*ss(prog(t,0.2,1.2)));\n  txt('3 Equipment, 3 Concepts',W/2,185,54,C.ink,a*ss(prog(t,0.3,1.5)));\n  chip('Venturi Meter \u00b7 Bernoulli',W/2,270,C.p,a*ss(prog(t,1.6,2.4)),22);\n  chip('Marcet Boiler \u00b7 Boiling',W/2,330,C.k,a*ss(prog(t,2.4,3.2)),22);\n  chip('Weirs \u00b7 Flow Over a Notch',W/2,390,C.g,a*ss(prog(t,3.2,4),),22);\n}\nfunction scEnd(t){\n  const a=sceneAlpha(t,57.2,61);\n  if(a&lt;=0)return;\n  ctx.save();ctx.globalAlpha=a*0.0;ctx.restore();\n}\n\n// ================= LOOP =================\nlet t=0,playing=true,last=performance.now();\nconst q=new URLSearchParams(location.search);\nif(q.has('t')){t=parseFloat(q.get('t'))||0;if(q.get('pause'))playing=false}\nconst pp=document.getElementById('pp'),rs=document.getElementById('rs'),bar=document.getElementById('bar'),fill=document.getElementById('fill'),tm=document.getElementById('tm');\nfunction step(dt){\n  for(const p of parts){p.x+=110*70/hh(p.x)*dt;if(p.x&gt;X1){p.x=X0;p.f=(Math.random()*2-1)*0.82}}\n  const boil=clamp((Tmarcet(t)-100)/80);\n  for(const b of bubbles){b.y+=b.s*dt/160*(0.5+boil*1.5);if(b.y&gt;1){b.y=0;b.x=Math.random()}}\n}\nfunction render(){\n  const bw=Math.round(cv.getBoundingClientRect().width*(window.devicePixelRatio||1));if(bw>0&&bw!==cv.width)fit();\n  const r=cv.width/W;ctx.setTransform(r,0,0,r,0,0);ctx.clearRect(0,0,W,H);\n  scTitle(t);scVenturi(t);scMarcet(t);scWeir(t);\n  subEl.textContent=subAt(t);\n  fill.style.width=(t/DUR*100)+'%';\n  tm.textContent=`0:${String(Math.floor(t)).padStart(2,'0')} / 1:00`;\n}\nfunction frame(now){\n  const dt=Math.min(0.05,(now-last)/1000);last=now;\n  if(playing){t+=dt;step(dt);if(t&gt;=DUR){t=DUR;playing=false;pp.textContent='\u25b6 Play'}}\n  render();requestAnimationFrame(frame);\n}\npp.onclick=()=&gt;{if(t&gt;=DUR)t=0;playing=!playing;pp.textContent=playing?'\u23f8 Pause':'\u25b6 Play'};\nrs.onclick=()=&gt;{t=0;playing=true;pp.textContent='\u23f8 Pause'};\nbar.onclick=e=&gt;{const r=bar.getBoundingClientRect();t=clamp((e.clientX-r.left)/r.width)*DUR};\nif(!playing)pp.textContent='\u25b6 Play';\nrequestAnimationFrame(frame);\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\"><\/iframe>\n<\/div>\n\n<\/div>\n<\/div>\n<\/section>\n\n<!-- ============ BANTUAN ============ -->\n<section id=\"bantuan\" style=\"padding:64px 24px 72px\">\n<div style=\"max-width:1200px;margin:0 auto\">\n<h2 style=\"margin:0 0 32px;font-family:'Josefin Sans','IBM Plex Sans',sans-serif;font-size:clamp(30px,4vw,42px);line-height:1.15\">Help<\/h2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px\">\n<div class=\"tl\" style=\"flex:1 1 320px;display:flex;gap:18px;align-items:flex-start;background:#ffffff;border:1px solid #C3CED3;border-radius:12px;padding:26px;box-shadow:0 1px 3px rgba(18,23,27,0.10)\">\n<span style=\"width:56px;height:56px;flex:0 0 56px;border-radius:50%;background:#D6E7E8;color:#0E5F66;display:flex;align-items:center;justify-content:center\"><svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 7v6M12 16.5h.01\"><\/path><\/svg><\/span>\n<div><div style=\"font-weight:700;font-size:21px\">Cannot attend a lab session?<\/div><div style=\"color:#243B4A;font-size:18px;margin-top:4px\">Tell your lecturer as early as possible. Medical reasons need valid documents.<\/div><\/div>\n<\/div>\n<a href=\"https://www.picktime.com/5ddaab35-5768-41bb-821c-6dd217f7222e#book/services\
