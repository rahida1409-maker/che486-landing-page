<title>PrepWISE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:#1B2140;background:#D9DDF0;display:flex;align-items:center;justify-content:center}
button,input,textarea,select{font:inherit;color:inherit}
.phone{width:100%;max-width:410px;height:100vh;max-height:860px;background:#ECEEF8;display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:520px){.phone{height:min(860px,96vh);border-radius:30px;border:6px solid #1B2140;box-shadow:0 10px 30px rgba(40,50,120,.25)}}
.top{background:linear-gradient(90deg,#4F4DB8,#4478C8);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:18px}.top>*:last-child{flex:0 0 auto}
.logo{width:34px;height:34px;display:flex;align-items:center;justify-content:center}.logo img{width:100%;height:100%;object-fit:contain;display:block}
.chip{font-size:11px;font-weight:500;border-radius:999px;padding:3px 9px;display:inline-block;white-space:nowrap}
.ok{background:#DDF3E8;color:#0B5A3A}.warn{background:#FFEBCF;color:#7A4306}.bad{background:#FFE0D6;color:#8A2A10}.mute{background:#E6E8F4;color:#454C7A}
.top .chip{background:rgba(255,255,255,.2);color:#fff}
.main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.hero{margin:-16px -16px 2px;padding:6px 16px 26px;background:linear-gradient(180deg,#4F4DB8 0%,#3E8AD1 100%);border-radius:0 0 26px 26px;color:#fff}
.hero h1,.hero .lbl,.hero .sub{color:#fff}.hero .lbl{opacity:.85}.hero .sub{opacity:.92}
.hero .link{color:#fff}
.steps{display:flex;gap:6px;margin-top:10px;justify-content:space-between}
.stp{flex:1;min-width:0;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;height:34px;font-size:13px;cursor:pointer}
.stp.on{background:#F0552A;font-weight:600}.stp.dn{background:#fff;color:#4F4DB8}
.tabs{display:flex;background:#fff;border-top:1px solid #DDE0F0}
.tab{flex:1;border:0;background:transparent;padding:8px 2px 10px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#6A71A0;cursor:pointer}
.tab .ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:#E6E8F4;color:#4F4DB8}
.tab.on{color:#F0552A;font-weight:600}.tab.on .ic{background:#F0552A;color:#fff}
.card{background:#fff;border:0;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 3px 10px rgba(40,50,120,.08)}
.card.hl{border:2px solid #4F4DB8}
h1{margin:0;font-size:24px;font-weight:600;line-height:1.2}
h2{margin:0;font-size:16px;font-weight:600}
p{margin:0}
.sub{font-size:13px;color:#505780;line-height:1.5}
.lbl{font-size:12px;font-weight:500;color:#6A71A0}
.btn{border:0;border-radius:999px;padding:12px 20px;min-height:48px;font-size:15px;font-weight:600;cursor:pointer;background:#F0552A;color:#fff;box-shadow:0 3px 8px rgba(240,85,42,.3)}
.btn.sec{background:#fff;color:#4F4DB8;border:1.5px solid #4F4DB8;box-shadow:none}
.btn:disabled{background:#E6E8F4;color:#7A80A8;cursor:not-allowed;box-shadow:none}
.in,textarea,select{width:100%;border:1px solid #C3C8E3;border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;min-height:44px}
textarea{line-height:1.5;resize:vertical}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;font-size:14px}
.qh{font-size:12px;font-weight:600;color:#6A71A0;text-transform:uppercase;letter-spacing:.06em;margin:10px 2px 0}.qrow{width:100%;height:auto;flex:0 0 auto;text-align:left;background:#fff;border:0;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;min-height:64px;box-sizing:border-box;overflow:hidden;box-shadow:0 3px 10px rgba(40,50,120,.08)}
.qnum{flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:linear-gradient(180deg,#4F4DB8,#3E8AD1);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.qrow .qt{flex:1 1 0;display:block;font-size:12px;line-height:1.4;min-width:0;overflow-wrap:anywhere}.qrow .qt .lbl{display:block;font-size:11px;line-height:1.3;margin-bottom:2px}.qrow .qt .qq{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.qrow .chip{flex:0 0 auto;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:#DDE0F0;overflow:hidden}.bar>i{display:block;height:100%;background:#F0552A}
.box{border-radius:12px;padding:12px;font-size:14px;line-height:1.5}

.f{display:flex;flex-direction:column;gap:6px}

#login>*{position:relative;z-index:1;flex:0 0 100%;max-width:420px;margin-inline:auto}
#login .lg-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;text-align:center}
#login .lg-brand img{width:92px;height:auto;display:block;filter:drop-shadow(0 0 20px rgba(110,130,255,.5))}
#login .lg-word{font-size:40px;line-height:1;letter-spacing:-.01em}
#login .lg-word span:last-child{text-shadow:0 0 26px rgba(143,230,255,.5)}
#login .lg-tag{font-size:11.5px;opacity:.78;letter-spacing:.24em;text-transform:uppercase}
#login .lg-tag::after{content:"";display:block;width:58px;height:2px;margin:14px auto 0;border-radius:2px;background:linear-gradient(90deg,#F0552A,#FFB36B,#8FE6FF)}
#login .lg-card{width:100%;background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.08));-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:26px;padding:28px 22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px rgba(20,16,80,.45),inset 0 1px 0 rgba(255,255,255,.2)}
#login .lg-card h2{margin:0;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.015em}
#login .lg-card h2::after{content:".";color:#8FE6FF}
#login .lg-card p{margin:0 0 6px;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.64)}
#login label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.56);margin-bottom:-6px}
#login input{font:inherit;font-size:16px;min-height:50px;padding:10px 16px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(28,22,96,.42);color:#fff;width:100%;box-sizing:border-box;transition:border-color .2s,box-shadow .2s,background .2s}
#login input::placeholder{color:rgba(255,255,255,.34)}
#login input:focus{outline:none;border-color:#8FE6FF;background:rgba(28,22,96,.62);box-shadow:0 0 0 4px rgba(143,230,255,.16)}
#login input:-webkit-autofill{-webkit-text-fill-color:#fff;caret-color:#fff;box-shadow:0 0 0 1000px #3A3A9C inset;transition:background-color 9999s}
#login .err{color:#FFD2C4;font-size:13px;min-height:18px}
#login .ok{color:#86F0B4}
#login .btn{width:100%;min-height:52px;border:0;border-radius:999px;color:#fff;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;background:linear-gradient(90deg,#F0552A 0%,#FF8A3D 100%);box-shadow:0 12px 28px rgba(240,85,42,.45),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,filter .15s,box-shadow .15s}
#login .btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
#login .btn:active:not(:disabled){transform:translateY(0)}
#login .btn:focus-visible{outline:2px solid #8FE6FF;outline-offset:3px}
#login .btn:disabled{background:rgba(255,255,255,.12);color:rgba(255,255,255,.45);box-shadow:none}
#login .lg-links{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
#login .lg-link{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:#8FE6FF;padding:6px 2px}
#login .lg-link:hover{text-decoration:underline;text-underline-offset:3px}
#login .lg-link:focus-visible{outline:2px solid #8FE6FF;border-radius:6px}
#login .lg-hint{font-size:12px;color:rgba(255,255,255,.5);margin:-2px 0 0}
#login .lg-ver{margin:20px auto 0;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6);text-align:center}
@media (prefers-reduced-motion:no-preference){#login .lg-brand img{animation:lgglow 5s ease-in-out infinite alternate}}
@keyframes lgglow{from{filter:drop-shadow(0 0 12px rgba(110,130,255,.35))}to{filter:drop-shadow(0 0 28px rgba(143,230,255,.6))}}
@container lg (min-width:820px){
#login>.lg-brand{flex:1 1 0;max-width:520px;margin:0;align-items:flex-start;text-align:left}
#login>.lg-card{flex:0 0 410px;margin:0}
#login>.lg-ver{position:absolute;left:0;right:0;bottom:18px;margin:0;max-width:none;flex:none}
#login .lg-brand img{width:116px}
#login .lg-word{font-size:68px}
#login .lg-tag{font-size:13px}
#login .lg-tag::after{margin-left:0}
}</style>

var AUTH=null;
function authSet(a){if(!AUTH)AUTH={toks:[]};AUTH.t=a.access_token;AUTH.r=a.refresh_token;AUTH.exp=Date.now()+(a.expires_in||3600)*1000;if(AUTH.toks.indexOf(a.access_token)<0)AUTH.toks.push(a.access_token)}
function authRefresh(){
 if(!AUTH||!AUTH.r)return Promise.reject(new Error('No session'));
 if(AUTH.p)return AUTH.p;
 AUTH.p=sbRaw('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:AUTH.r}}).then(function(a){authSet(a);AUTH.p=null}).catch(function(e){if(AUTH)AUTH.p=null;throw e});
 return AUTH.p}
function sessionEnded(){
 PROG={};CQ={};CLAB=null;PLAB=null;LEC=null;LIVE=null;LQ=null;AUTH=null;refReset();

 loginShow();LG.msg='Your session has ended. Please sign in again.';LG.ok=false;lgRender()}
function sb(path,opt){opt=opt||{};
 if(!(opt.token&&AUTH&&AUTH.toks.indexOf(opt.token)>=0))return sbRaw(path,opt);
 var go=function(){return sbRaw(path,Object.assign({},opt,{token:AUTH.t}))};
 var pre=AUTH.exp-Date.now()<60000?authRefresh().catch(function(){}):Promise.resolve();
 return pre.then(go).catch(function(e){
  if(!/jwt expired/i.test(e.message)||!AUTH||!AUTH.r)throw e;

var secs=Object.keys(S.rep),s=S.repSec;
var r='<div class="hero f"><span class="lbl">After hands-on</span><h1>Write the report</h1><p class="sub">The app asks guiding questions for each section. Your group writes the sentences.</p></div>';
r+='<div class="pills" id="secpills">'+secs.map(function(k){return '<button class="pill'+(k===s?' on':'')+'" data-sec="'+k+'">'+k+(S.rep[k].trim()?' ✓':'')+'</button>'}).join('')+'</div>';
r+='<div class="card hl"><h2>'+s+'</h2><div class="box g"><b>Guiding questions</b><ul style="margin:6px 0 0;padding-left:18px">'+GUIDE[s].map(function(g){return '<li>'+esc(g)+'</li>'}).join('')+'</ul></div><label class="lbl" for="rt">Your group\'s writing</label><textarea id="rt" rows="8" data-rep="'+s+'">'+esc(S.rep[s])+'</textarea></div>';
r+='<div class="card"><h2>Structure check</h2><div id="chk"></div></div>';
r+='<div class="card"><h2>Integrity declaration</h2><label class="opt" style="height:auto;padding:10px 12px"><input type="checkbox" id="integ" '+(S.integ?'checked':'')+'>This report was written by our group and all references are cited.</label><div class="f"><span class="lbl">Was AI assistance used?</span><label class="opt"><input type="radio" name="ai" value="yes" '+(S.ai==='yes'?'checked':'')+'>Yes, and I explain how</label><label class="opt"><input type="radio" name="ai" value="no" '+(S.ai==='no'?'checked':'')+'>No</label></div></div>';
r+='<button class="btn" id="subbtn" data-act="submitrep">Submit report</button><p class="sub" id="submsg"></p>';
return r;
}
function repChecks(){
var secs=Object.keys(S.rep),filled=secs.filter(function(k){return S.rep[k].trim()}),el=$('chk');if(!el)return;
var items=[[filled.length+' of 6 sections have content',filled.length===6]];
if(S.rep.Discussion.trim())items.push(['Discussion refers to your expectation',/expect/i.test(S.rep.Discussion)]);
if(S.rep.Conclusion.trim())items.push(['Conclusion reports Cd for both notches',/cd/i.test(S.rep.Conclusion)]);
if(S.rep.Results.trim())items.push(['Results refers to a figure or table',/figure|table|graph/i.test(S.rep.Results)]);
el.innerHTML=items.map(function(i){return '<div class="row" style="align-items:flex-start"><span style="line-height:1.4">'+esc(i[0])+'</span><span class="chip '+(i[1]?'ok':'warn')+'">'+(i[1]?'OK':'Check')+'</span></div>'}).join('');
var ok=filled.length===6&&S.integ;$('subbtn').disabled=!ok;
$('submsg').textContent=ok?'':'Complete all six sections and tick the declaration to submit.';
}
document.addEventListener('click',function(e){
var el=e.target.closest('[data-tab],[data-open],[data-act],[data-go],[data-match],[data-sec],[data-notch]');if(!el)return;
if(el.dataset.notch){S.notch=el.dataset.notch;S.pend=null;S.predMsg='';render();return}
if(el.dataset.tab){S.tab=el.dataset.tab;S.open=null;render();return}
if(el.dataset.go){S.tab=el.dataset.go;render();return}
if(el.dataset.open!==undefined){S.open=+el.dataset.open;render();return}
if(el.dataset.match){S.match=el.dataset.match;render();return}
if(el.dataset.sec){S.repSec=el.dataset.sec;render();return}
var a=el.dataset.act;
if(a==='start'){S.started=true;S.picked=false;S.pickMsg='';render()}
else if(a==='picklab'){S.picked=true;S.pickMsg='';if(isDesk())S.tab='dashboard';render()}
else if(a==='labna'){S.pickMsg='Your lecturer has not opened this lab yet.';render()}
else if(a==='labs'){S.picked=false;S.pickMsg='';render()}
else if(a==='logout'){LQ=null;S.started=false;S.picked=false;S.pickMsg='';render()}
else if(a==='back'){S.open=null;render()}
else if(a==='lqrecord'){lqRecord()}
else if(a==='submitq'&&isLive()){lqSubmit()}
else if(a==='submitq'){var q=S.qs[S.open],ta=$('qa');q.a=ta.value;if(!q.a.trim()){$('qmsg').textContent='Write an answer first.';return}q.done=true;S.open=null;render()}
else if(a==='farid'){S.farid=true;render()}
else if(a==='record'&&isLive()){return}
else if(a==='record'){var ga=$('ga').value;S.groupAns=ga;if(!ga.trim()){$('gmsg').textContent='Write the group answer first.';return}
var all=Object.keys(S.agree).every(function(k){return S.agree[k]});if(!all){$('gmsg').textContent='All members must agree before you record it.';return}S.groupDone=true;render()}
else if(a==='demoall'){doDemo();render()}
else if(a==='saverow'){readDraft();var f=chk(D());if(f.length){S.pend=f;render();return}commit('')}
else if(a==='retime'){S.pend=null;D().t=['','',''];render()}
else if(a==='keep'){commit('flag')}
else if(a==='submitrep'){S.submitted=true;render()}
else if(a==='reopen'){S.submitted=false;render()}
});
document.addEventListener('change',function(e){var t=e.target;if(t&&t.getAttribute&&t.getAttribute('data-lagree')!==null){var m=$('gmsg');if(m)m.textContent=''}});
function doDemo(){S.qs.forEach(function(q){if(!q.done){q.done=true;q.a='(sample answer)'}});S.farid=true;S.groupAns=S.groupAns||'Q increases with H for both notches. We will test whether it is proportional by plotting Q against H.';S.groupDone=true;Object.keys(S.agree).forEach(function(k){S.agree[k]=true})}
function applyHash(){var h=(location.hash||'').replace('#','');var base=h.split('-')[0];if(h==='labs'){S.started=true;S.picked=false;return true}if(h==='dashboard'){S.started=true;S.picked=true;S.tab='dashboard';return true}if(!TABS.some(function(t){return t[0]===base}))return false;S.started=true;S.picked=true;S.tab=base;S.open=null;if(/-open$/.test(h))doDemo();var m=h.match(/-q(\d)$/);if(base==='questions'&&m){S.open=Math.max(0,Math.min(6,+m[1]-1))}return true}
function readDraft(){S.draft[S.notch]={h:$('dh').value.trim(),v:$('dv').value.trim(),t:[0,1,2].map(function(i){return $('dt'+i).value.trim()})}}
function commit(fl){
var d={h:D().h,v:D().v,t:D().t.slice(),fl:fl};
var tr=chk(d).length?'':trend(d);
var prev=R()[R().length-1],msg='';
if(prev&&!isNaN(qOf(d))&&parseFloat(d.h)<1){var dir=qOf(d)>qOf(prev)?'up':(qOf(d)<qOf(prev)?'down':'same');msg=(dir===S.pred?'Your prediction matched: ':'Your prediction differed: ')+'the flow went '+(dir==='up'?'up':dir==='down'?'down':'nowhere')+' compared with the previous row.'+(tr?' '+tr:'')}
R().push(d);S.predMsg=msg;S.pend=null;
var lastH=parseFloat(d.h);S.draft[S.notch]={h:isNaN(lastH)?'':(lastH+0.005).toFixed(3),v:d.v,t:['','','']};
render();
}
document.addEventListener('input',function(e){
var t=e.target;
if(t.dataset&&t.dataset.rep){S.rep[t.dataset.rep]=t.value;repChecks()}
else if(t.dataset&&t.dataset.cd!==undefined){S.cd[S.notch][t.dataset.cd]=t.value}
else if(t.dataset&&t.dataset.cdn!==undefined){S.cdNote[S.notch][t.dataset.cdn]=t.value}
else if(t.id==='gn')S.graphNote=t.value;
else if(t.id==='rf')S.reflect=t.value;
else if(t.id==='mn')S.matchNote=t.value;
else if(t.id==='ga')S.groupAns=t.value;
else if(t.id==='qa'){S.qs[S.open].a=t.value}
});
document.addEventListener('change',function(e){
var t=e.target;
if(t.name==='pred')S.pred=t.value;
else if(t.name==='ai')S.ai=t.value;
else if(t.id==='integ'){S.integ=t.checked;repChecks()}
else if(t.dataset&&t.dataset.agree){S.agree[t.dataset.agree]=t.checked}
else if(t.dataset&&t.dataset.cd!==undefined){render()}
});
applyHash();render();
window.addEventListener('hashchange',function(){if(applyHash())render()});

(function(){
var t;function note(){var n=document.getElementById('nopaste');if(!n){n=document.createElement('div');n.id='nopaste';n.className='nopaste';n.textContent='Pasting is turned off. Please type your own answer.';document.body.appendChild(n)}n.classList.add('show');clearTimeout(t);t=setTimeout(function(){n.classList.remove('show')},2200)}
function isField(e){var el=e.target;return el&&(el.tagName==='TEXTAREA'||el.tagName==='INPUT')}
['paste','drop'].forEach(function(ev){document.addEventListener(ev,function(e){if(isField(e)){e.preventDefault();note()}},true)});
document.addEventListener('dragover',function(e){if(isField(e))e.preventDefault()},true);
document.addEventListener('beforeinput',function(e){if(isField(e)&&/^insertFrom(Paste|Drop|PasteAsQuotation)$|^insertReplacementText$|^insertFromYank$/.test(e.inputType)){e.preventDefault();note()}},true);
document.addEventListener('keydown',function(e){if(isField(e)&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'||isField(e)&&e.shiftKey&&e.key==='Insert'){e.preventDefault();note()}},true);
document.addEventListener('contextmenu',function(e){if(e.target&&e.target.tagName==='TEXTAREA')e.preventDefault()},true);
document.addEventListener('focusin',function(e){var el=e.target;if(el&&(el.tagName==='TEXTAREA'||el.tagName==='INPUT')){el.setAttribute('autocomplete','off');el.setAttribute('autocorrect','off');el.setAttribute('spellcheck','false')}});
})();


var LG={mode:'in',msg:'',ok:false,email:'',token:''};
function appUrl(){return location.origin+location.pathname}
function lgField(id,lab,type,ph,ac,val){return '<label for="'+id+'">'+lab+'</label><input id="'+id+'" type="'+type+'" placeholder="'+ph+'" autocomplete="'+ac+'"'+(type==='email'?' inputmode="email"':'')+(val?' value="'+esc(val)+'"':'')+'>'}
function lgRender(){
 var m=LG.mode,h='',btn='Sign in',links='';
 var emailPh='2025xxxxxx@student.uitm.edu.my';
 if(m==='in'){h='<h2>Sign in</h2><p>Use your student or lecturer email.</p>'+lgField('lg-email','Email','email',emailPh,'username',LG.email)+lgField('lg-pw','Password','password','Password','current-password');
  links='<button class="lg-link" data-lgm="up">Create account</button><button class="lg-link" data-lgm="forgot">Forgot password?</button>'}
 else if(m==='up'){btn='Create account';h='<h2>Create account</h2><p>Use the email that starts with your student number.</p>'+lgField('lg-email','Email','email',emailPh,'username',LG.email)+lgField('lg-pw','Password','password','At least 8 characters','new-password')+lgField('lg-pw2','Confirm password','password','Repeat password','new-password');
  links='<button class="lg-link" data-lgm="in">Back to sign in</button>'}
 else if(m==='forgot'){btn='Send reset link';h='<h2>Reset password</h2><p>Enter your email and we will send a reset link.</p>'+lgField('lg-email','Email','email',emailPh,'username',LG.email);
  links='<button class="lg-link" data-lgm="in">Back to sign in</button>'}
 else{btn='Save password';h='<h2>Set a new password</h2><p>Choose a password with at least 8 characters.</p>'+lgField('lg-pw','New password','password','At least 8 characters','new-password')+lgField('lg-pw2','Confirm password','password','Repeat password','new-password')}
 $('lg-card').innerHTML=h+'<div class="err'+(LG.ok?' ok':'')+'" id="lg-err" role="alert">'+esc(LG.msg)+'</div><button class="btn" id="lg-go">'+btn+'</button>'+(links?'<div class="lg-links">'+links+'</div>':'');
 $('lg-go').onclick=lgGo;
 var last=$('lg-pw2')||$('lg-pw')||$('lg-email');if(last)last.onkeydown=function(e){if(e.key==='Enter')lgGo()};
 var ls=$('lg-card').querySelectorAll('[data-lgm]');for(var k=0;k<ls.length;k++)ls[k].onclick=function(){var em=$('lg-email');if(em)LG.email=em.value.trim();LG.mode=this.getAttribute('data-lgm');LG.msg='';LG.ok=false;lgRender()}}
function lgSay(msg,ok){LG.msg=msg;LG.ok=!!ok;var e=$('lg-err');if(e){e.textContent=msg;e.className='err'+(ok?' ok':'')}}
function lgGo(){
 var m=LG.mode,em=$('lg-email')?$('lg-email').value.trim():'',pw=$('lg-pw')?$('lg-pw').value:'',pw2=$('lg-pw2')?$('lg-pw2').value:'',go=$('lg-go');
 lgSay('');
 var done=function(){go.disabled=false},fail=function(e){lgSay(e.message);done()};
 if(m==='in'){go.disabled=true;LG.email=em;
  signIn(em,pw).then(function(){$('login').style.display='none';if(LEC){renderLecturer();return}ME={group:LIVE.group,name:LIVE.name};S.started=false;render()}).catch(fail).then(done);return}
 if(m==='up'){
  if(!/^[0-9]{10}@/.test(em))return lgSay('Use the email that starts with your 10-digit student number.');
  if(pw.length<8)return lgSay('Choose a password with at least 8 characters.');
  if(pw!==pw2)return lgSay('The two passwords do not match.');
  go.disabled=true;
  sb('/auth/v1/signup?redirect_to='+encodeURIComponent(appUrl()),{method:'POST',body:{email:em,password:pw}}).then(function(){LG.email=em;LG.mode='in';lgRender();lgSay('Check your email for a confirmation link, then sign in.',true)}).catch(fail).then(done);return}
 if(m==='forgot'){
  if(!em)return lgSay('Enter your email.');
  go.disabled=true;
  sb('/auth/v1/recover?redirect_to='+encodeURIComponent(appUrl()),{method:'POST',body:{email:em}}).then(function(){LG.email=em;LG.mode='in';lgRender();lgSay('If that email is registered, a reset link is on its way.',true)}).catch(fail).then(done);return}
 if(m==='reset'){
  if(pw.length<8)return lgSay('Choose a password with at least 8 characters.');
  if(pw!==pw2)return lgSay('The two passwords do not match.');
  go.disabled=true;
  sb('/auth/v1/user',{method:'PUT',token:LG.token,body:{password:pw}}).then(function(){LG.token='';LG.mode='in';lgRender();lgSay('Password updated. Sign in with your new password.',true)}).catch(function(e){lgSay(/expired|invalid|session/i.test(e.message)?'This reset link has expired. Request a new one.':e.message);done()}).then(done)}}
function loginShow(){AUTH=null;LG.mode='in';LG.msg='';LG.ok=false;LG.token='';lgRender();$('login').style.display='flex'}
if(PW_CFG.url&&PW_CFG.anonKey){
 $('lec-back').onclick=function(){LIVE=null;S.started=false;S.picked=false;$('lec-back').style.display='none';renderLecturer()};
 var hp={};try{(location.hash||'').replace(/^#/,'').split('&').forEach(function(p){var kv=p.split('=');if(kv[0])hp[kv[0]]=decodeURIComponent((kv[1]||'').replace(/\+/g,' '))})}catch(e){}
 if(hp.type==='recovery'&&hp.access_token){LG.mode='reset';LG.token=hp.access_token}
 else if(hp.access_token&&(hp.type==='signup'||hp.type==='email'||hp.type==='magiclink')){LG.msg='Email confirmed. You can sign in now.';LG.ok=true}
 else if(hp.error_description){LG.msg=/expired|invalid/i.test(hp.error_description)?'That link has expired. Request a new one.':hp.error_description}
 if(hp.access_token||hp.error_description){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
 lgRender();$('login').style.display='flex';
}
</script>
